# Keeps the Render free-plan service awake.
#
# Render puts a free web service to sleep after 15 minutes without traffic;
# the next visitor then waits 30-60 s while it boots, and while it sleeps the
# in-process tracking refresh (node-cron, TRACKING_REFRESH_MINUTES) doesn't
# run, so courier updates and push notifications arrive late.
#
# This pings the health endpoint every 5 minutes. GitHub runs scheduled
# workflows late when it is busy (10+ minutes is common), so 5 leaves margin
# under Render's 15-minute idle window. Free for a public repository.
#
# It is a workaround: Render's free plan allows ~750 instance-hours a month
# (enough for one always-on service) and could stop tolerating pings. The
# real fix is the Starter plan, after which this file can simply be deleted.
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 10 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://sputnik-ship.onrender.com/api/health
