<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="promo.css">
<style>
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.logowrap{position:relative;animation:glow 1.1s ease-out 1.5s forwards}
.logo{width:240px;height:240px;overflow:visible}
.logo .draw{fill:none;stroke:url(#g);stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s cubic-bezier(.4,0,.2,1) .4s forwards}
.logo .fill{fill:url(#g);opacity:0;animation:fillin .6s ease-out 1.4s forwards}
.logowrap .ring{width:240px;height:240px;left:0;top:0}
#name,#url,#cta{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
#name{font-size:88px;font-weight:600;letter-spacing:-.04em;color:var(--text)}
#url{font-family:var(--font-mono);font-size:28px;color:var(--muted);letter-spacing:.06em}
#cta{margin-top:30px;background:var(--accent);color:#fff;font-size:34px;font-weight:500;padding:26px 52px;border-radius:18px;box-shadow:0 20px 60px -10px rgba(94,106,210,.7)}
#cta.show{animation:ctaglow 1.8s ease-in-out .6s infinite}
.show{opacity:1 !important;transform:none !important}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:1}}
@keyframes glow{to{filter:drop-shadow(0 40px 80px rgba(94,106,210,.6))}}
@keyframes ctaglow{0%,100%{box-shadow:0 20px 60px -10px rgba(94,106,210,.7)}50%{box-shadow:0 26px 80px -6px rgba(139,124,246,.95)}}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="center">
  <div class="logowrap">
    <div class="ring" id="ring"></div>
    <svg class="logo" viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#5e6ad2"/></linearGradient></defs>
      <path class="fill" fill-rule="evenodd" d="M50 4 C52.5 4 54.5 5.5 55.8 7.8 L95 76 C96.6 78.8 94.6 82 91.4 82 L72 82 L58 97 C53.6 100.6 46.4 100.6 42 97 L28 82 L8.6 82 C5.4 82 3.4 78.8 5 76 L44.2 7.8 C45.5 5.5 47.5 4 50 4 Z M50 44 L62 62 L50 82 L38 62 Z"/>
      <path class="draw" pathLength="1000" d="M50 4 C52.5 4 54.5 5.5 55.8 7.8 L95 76 C96.6 78.8 94.6 82 91.4 82 L72 82 L58 97 C53.6 100.6 46.4 100.6 42 97 L28 82 L8.6 82 C5.4 82 3.4 78.8 5 76 L44.2 7.8 C45.5 5.5 47.5 4 50 4 Z M50 44 L62 62 L50 82 L38 62 Z"/>
    </svg>
  </div>
  <div id="name">Sputnik Ship</div>
  <div id="url">sputnikship.app</div>
  <div id="cta">Track your first shipment</div>
</div>
<script>
const at=(ms,fn)=>setTimeout(fn,ms);const show=id=>document.getElementById(id).classList.add('show');
at(1500,()=>document.getElementById('ring').classList.add('go'));
at(1800,()=>show('name'));at(2200,()=>show('url'));at(2600,()=>show('cta'));
</script></body></html>
