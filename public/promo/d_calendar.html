<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="promo.css">
<style>
.cal-head,.view-header{opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1)}
.day{opacity:0;transform:scale(.7);transition:opacity .4s cubic-bezier(.23,1,.32,1),transform .4s cubic-bezier(.23,1,.32,1)}
.day.show{opacity:1;transform:none}
.day.today b{animation:none}
.day.today.live b{animation:ringPulse 2s infinite}
.day b::after{transition:background .3s}
.cal-alert{opacity:0;transform:translateY(8px);transition:opacity .5s cubic-bezier(.23,1,.32,1),transform .5s cubic-bezier(.23,1,.32,1)}
.cal-item{opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1),border-color .4s,box-shadow .4s}
.cal-item.show{opacity:1;transform:none}
.cal-item.warnlift{border-color:rgba(242,180,92,.55);box-shadow:0 18px 50px -24px rgba(242,180,92,.6)}
.cal-item .badge{opacity:0;transform:scale(.7);transition:opacity .35s cubic-bezier(.23,1,.32,1),transform .35s cubic-bezier(.23,1,.32,1)}
.cal-item .badge.show{opacity:1;transform:none}
.cal-item .t span{transition:color .3s}
.inner{position:relative}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="stagewrap"><div class="phonewrap"><div class="device"><div class="screen"><div class="notch"></div><div class="sbar"><span>14:02</span><span>●●●</span></div><div class="inner">
<div class="push" id="push"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></div><div><b>Out for delivery</b><span>Birthday gift for mamá · by 18:00</span></div><em>now</em></div>
<div class="app"><div class="content">
<div class="view-header" id="vh"><h2>Calendar</h2></div>
<div class="cal-head" id="ch"><div><div class="cal-month">September 2026</div><div class="cal-today">Today · Fri 18</div></div></div>
<div class="week" id="week">
<button class="day">M<b>14</b></button><button class="day has">T<b>15</b></button><button class="day">W<b>16</b></button><button class="day has">T<b>17</b></button><button class="day today has" id="today">F<b>18</b></button><button class="day">S<b>19</b></button><button class="day has" id="sat">S<b>20</b></button></div>
<div class="cal-alert" id="alert"><i></i>3 packages out for delivery today</div>
<div class="cal-list" id="cl">
<div class="cal-item"><div class="c">FDX</div><div class="t"><b>Birthday gift for mamá</b><span>by 18:00 · Marina · Paris</span></div><span class="badge status-out_for_delivery">Out today</span></div>
<div class="cal-item"><div class="c">UPS</div><div class="t"><b>Desk lamp, office move</b><span>by 20:00</span></div><span class="badge status-out_for_delivery">Out today</span></div>
<div class="cal-item" id="late"><div class="c">SEUR</div><div class="t"><b>Replacement charger</b><span id="latetxt">by 19:30</span></div><span class="badge badge-delay">Delayed</span></div>
</div></div></div></div></div></div></div></div><script>
const at=(ms,fn)=>setTimeout(fn,ms);const $=s=>document.querySelector(s);const show=el=>el.classList.add('show');
at(500,()=>show($('#vh')));at(650,()=>show($('#ch')));
document.querySelectorAll('.day').forEach((d,i)=>at(900+i*70,()=>show(d)));
at(1500,()=>$('#today').classList.add('live'));
at(1900,()=>show($('#alert')));
const items=[...document.querySelectorAll('.cal-item')];
items.forEach((el,i)=>at(2500+i*320,()=>{show(el);at(260,()=>show(el.querySelector('.badge')))}));
at(4600,()=>$('#push').classList.add('in'));
at(7300,()=>$('#push').classList.remove('in'));
at(7600,()=>{$('#late').classList.add('warnlift');$('#latetxt').textContent='rescheduled → Sat 20';$('#latetxt').style.color='var(--warn)';$('#sat').classList.add('delay')});
</script></body></html>
