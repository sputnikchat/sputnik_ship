<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="promo.css">
<style>
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.k{font-family:var(--font-mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);opacity:0;transform:translateY(12px);transition:opacity .5s cubic-bezier(.23,1,.32,1),transform .5s cubic-bezier(.23,1,.32,1)}
.h{font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--text);opacity:0;transform:scale(.94);transition:opacity .6s cubic-bezier(.23,1,.32,1),transform .6s cubic-bezier(.23,1,.32,1)}
.show{opacity:1 !important;transform:none !important}
#chips{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:820px;margin-top:20px}
#chips span{font-family:var(--font-mono);font-size:30px;font-weight:600;padding:18px 30px;border-radius:999px;border:1px solid var(--line2);background:rgba(15,16,23,.85);color:#c3c8f0;opacity:0;transform:translateY(14px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1),border-color .45s}
#chips span.on{opacity:1;transform:none;border-color:rgba(94,106,210,.5)}
#chips span.float{animation:floaty 5s ease-in-out infinite}
.orbit{position:absolute;width:1200px;height:1200px;border-radius:50%;border:1px solid rgba(139,124,246,.12);left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity 1s,transform 1.4s cubic-bezier(.23,1,.32,1)}
.orbit.show{opacity:1;transform:translate(-50%,-50%) scale(1) !important}
.orbit.o2{width:820px;height:820px}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="orbit" id="o1"></div><div class="orbit o2" id="o2"></div>
<div class="wrap">
<div class="k" id="k">Every courier</div>
<div class="h" id="h">One app.</div>
<div id="chips"></div></div><script>
const at=(ms,fn)=>setTimeout(fn,ms);const show=id=>document.getElementById(id).classList.add('show');
at(500,()=>show('k'));at(800,()=>{show('h');show('o1')});at(1000,()=>show('o2'));
const names=['FedEx','UPS','DHL','USPS','Correos','SEUR','GLS','DPD','MRW','Royal Mail'];
const c=document.getElementById('chips');
names.forEach((n,i)=>{const s=document.createElement('span');s.textContent=n;s.style.animationDelay=(-i*0.7)+'s';c.appendChild(s);at(1300+i*130,()=>s.classList.add('on'));at(1300+i*130+500,()=>s.classList.add('float'));});
</script></body></html>
