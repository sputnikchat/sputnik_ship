<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 30%,rgba(94,106,210,.22),transparent 70%),var(--bg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%)}
.stagewrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phonewrap{width:760px}
.phonewrap .app{min-height:0;padding:0;background:transparent}
.phonewrap .content{max-width:none;padding:0}
.device{width:760px;background:#0a0b10;border:2px solid #262937;border-radius:80px;padding:22px;box-shadow:0 0 0 2px rgba(255,255,255,.04) inset,0 120px 200px -60px rgba(94,106,210,.55),0 40px 80px -20px rgba(0,0,0,.9)}
.screen{background:#07080c;border-radius:62px;overflow:hidden;position:relative;min-height:1500px}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:200px;height:52px;border-radius:999px;background:#000;z-index:5}
.sbar{display:flex;justify-content:space-between;padding:26px 48px 0;font-size:22px;font-weight:600;font-family:var(--font-mono)}
.inner{transform:scale(1.72);transform-origin:top left;width:calc(760px/1.72 - 26px);padding:0 0 0 0;margin:24px 0 0 22px}
.rv{opacity:1;transform:none}
</style></head><body><div class="bg"></div><div class="grid"></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px">
<div style="font-family:var(--font-mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)">Every courier</div>
<div style="font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--text)">One app.</div>
<div id="chips" style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:820px;margin-top:20px"></div></div><script>
const names=['FedEx','UPS','DHL','USPS','Correos','SEUR','GLS','DPD','MRW','Royal Mail'];
const c=document.getElementById('chips');
names.forEach((n,i)=>{const s=document.createElement('span');s.textContent=n;s.style.cssText='font-family:var(--font-mono);font-size:30px;font-weight:600;padding:18px 30px;border-radius:999px;border:1px solid var(--line2);background:rgba(15,16,23,.85);color:#c3c8f0;opacity:0;transform:translateY(14px);transition:all .45s';c.appendChild(s);setTimeout(()=>{s.style.opacity=1;s.style.transform='none';s.style.borderColor='rgba(94,106,210,.5)'},400+i*180);});
</script></body></html>
