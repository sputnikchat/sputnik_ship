<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="promo.css">
<style>
.chat-msg.mine.has-photo .chat-msg-text{color:#fff}
.chat-msg.has-photo{width:92%}
.chat-msg-photo{max-height:300px}
.chat-head,.chat-form{opacity:0;transform:translateY(8px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1)}
.chat-msg,.chat-msg-system,.typing{opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1)}
.typing.gone{display:none}
.chat-msg-photo-wrap{overflow:hidden}
.chat-msg-photo{transform:scale(1.08);transition:transform 1.2s cubic-bezier(.23,1,.32,1)}
.show .chat-msg-photo{transform:scale(1)}
.chat-msg-photo-badge{opacity:0;transform:scale(.6);transition:opacity .35s cubic-bezier(.23,1,.32,1),transform .35s cubic-bezier(.23,1,.32,1)}
.chat-msg-photo-badge.show{opacity:1;transform:none}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
.chat-form .icon-btn{transition:box-shadow .3s,color .3s,border-color .3s}
.chat-form .icon-btn.hot{color:#c3c8f0;border-color:rgba(94,106,210,.6);box-shadow:0 0 0 4px var(--accent-soft)}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="stagewrap"><div class="phonewrap"><div class="device"><div class="screen"><div class="notch"></div><div class="sbar"><span>14:02</span><span>●●●</span></div><div class="inner"><div class="app"><div class="content">
<div class="chat-head" id="head" style="display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1px solid var(--line)"><div class="avatar avatar-sm">M</div><div><b style="display:block;font-size:14px">Marina Costa</b><span style="font-size:11px;color:var(--dim);font-family:var(--font-mono)">SPK-839201 · recipient</span></div></div>
<div class="chat-messages" style="max-height:none;margin-top:12px;overflow:visible">
<div class="chat-msg" id="m1"><div class="chat-msg-text">Is it on its way? 🙈</div><span class="chat-msg-meta">Marina · 16:31</span></div>
<div class="chat-msg mine has-photo" id="ph"><div class="chat-msg-photo-wrap"><img class="chat-msg-photo" src="pkg.jpg"><div class="shutter" id="shutter"></div><div class="chat-msg-photo-badge" id="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Metadata removed</div></div><div class="chat-msg-text">Just dropped it at the counter in Brooklyn 📦</div><span class="chat-msg-meta">you · 16:39</span></div>
<div class="chat-msg-system" id="sys">photo delivered · EXIF stripped · end-to-end</div>
<div class="typing" id="typing"><i></i><i></i><i></i></div>
<div class="chat-msg" id="reply"><div class="chat-msg-text">Parfait! Leave it with the concierge, 3rd floor 🙏</div><span class="chat-msg-meta">Marina · 16:40</span></div>
</div>
<div class="chat-form" id="form" style="position:static;margin-top:14px"><button class="icon-btn" id="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></button><input placeholder="Write a message…"><button class="btn-primary">➤</button></div>
</div></div></div></div></div></div></div><script>
const at=(ms,fn)=>setTimeout(fn,ms);const $=s=>document.querySelector(s);const show=id=>document.getElementById(id).classList.add('show');
at(500,()=>{show('head');show('form')});
at(800,()=>show('m1'));
at(1500,()=>$('#cam').classList.add('hot'));
at(2000,()=>{$('#cam').classList.remove('hot');show('ph')});
at(2250,()=>{$('#shutter').style.opacity=.85;at(140,()=>$('#shutter').style.opacity=0)});
at(3000,()=>show('badge'));
at(3600,()=>show('sys'));
at(4200,()=>show('typing'));
at(5100,()=>{$('#typing').classList.add('gone');show('reply')});
</script></body></html>
