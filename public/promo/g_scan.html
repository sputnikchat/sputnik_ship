<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="promo.css">
<style>
.scan-frame-corner{width:40px;height:40px;transition:border-color .3s}
#frame{transition:transform .3s cubic-bezier(.23,1,.32,1)}
#frame.tight{transform:scale(.985)}
#label{transition:transform 3s ease-in-out}
#shipment-form label{opacity:0;transform:translateY(6px);transition:opacity .4s cubic-bezier(.23,1,.32,1),transform .4s cubic-bezier(.23,1,.32,1)}
#form{opacity:0;transition:opacity .5s}
#cam{transition:height .55s cubic-bezier(.23,1,.32,1)}
.scan-status-pill.ok{border-color:rgba(62,207,142,.5);color:var(--ok)}
.scan-status-pill.ok::before{animation:none}
#save{opacity:0;transform:translateY(8px);transition:opacity .45s cubic-bezier(.23,1,.32,1),transform .45s cubic-bezier(.23,1,.32,1);width:100%;margin-top:10px;animation:none}
#save.show{animation:glowpulse 1.6s ease-in-out .3s infinite}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px -8px rgba(94,106,210,.6)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 14px 34px -6px rgba(94,106,210,.9)}}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="stagewrap"><div class="phonewrap"><div class="device"><div class="screen"><div class="notch"></div><div class="sbar"><span>14:02</span><span>●●●</span></div><div class="inner"><div class="app"><div class="content">
<div class="view-header"><h2 class="section-k" style="font-size:11px">New shipment</h2></div>
<div id="cam" style="position:relative;height:640px;background:#141516;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)">
 <div id="frame" style="width:70%;position:relative;aspect-ratio:1.4">
  <div id="label" style="position:absolute;inset:14px;background:#f5f6fa;border-radius:6px;padding:12px 14px;font-family:var(--font-mono);color:#0b0c12;font-size:10px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.4)"><div style="height:18px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 4px,#000 4px 5px,transparent 5px 8px);margin-bottom:8px"></div><b>TO:</b> Marina Costa<br>14 Rue de Bretagne, 75003 Paris<br><b>FROM:</b> J. Alvarez, Brooklyn NY<br><b>TRACKING:</b> 7749 0213 8850<br>EXPRESS · 2.3 KG</div>
  <div class="scan-frame-corner tl"></div><div class="scan-frame-corner tr"></div><div class="scan-frame-corner bl"></div><div class="scan-frame-corner br"></div>
  <div class="scan-line" id="line"></div>
 </div>
 <div class="scan-status-pill" id="pill" style="position:absolute;top:16px;left:16px">Scanning label</div>
 <div id="flash" style="position:absolute;inset:0;background:var(--accent);opacity:0;transition:opacity .3s"></div>
</div>
<div id="form" style="margin-top:14px">
<div style="display:flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid rgba(94,106,210,.35);border-radius:9px;padding:10px 12px;font-size:12.5px;color:#c3c8f0;margin-bottom:10px">✓ Label detected — filled in below</div>
<form id="shipment-form">
<label>Courier<input value="FedEx International"></label>
<label>Tracking number<input class="mono" value="7749 0213 8850"></label>
<label>Recipient<input value="Marina Costa · 14 Rue de Bretagne, 75003 Paris"></label>
<div class="field-row"><label>Weight<input class="mono" value="2.3 kg"></label><label>Value<input class="mono" value="€45.90"></label></div>
</form>
<button class="btn-primary" id="save">Add shipment</button>
</div></div></div></div></div></div></div></div><script>
const at=(ms,fn)=>setTimeout(fn,ms);const $=s=>document.querySelector(s);
at(700,()=>{$('#label').style.transform='translateY(-3px) rotate(-.4deg)'});
at(1500,()=>{$('#pill').textContent='Reading barcode…';$('#frame').classList.add('tight')});
at(2500,()=>{$('#flash').style.opacity=.55;$('#frame').classList.remove('tight')});
at(2800,()=>{$('#flash').style.opacity=0;$('#pill').textContent='✓ Label detected';$('#pill').classList.add('ok');document.querySelectorAll('.scan-frame-corner').forEach(c=>c.style.borderColor='var(--ok)');$('#line').style.display='none'});
at(3200,()=>{$('#cam').style.height='300px';$('#form').style.opacity=1;document.querySelectorAll('#shipment-form label').forEach((l,i)=>at(300+i*220,()=>{l.style.opacity=1;l.style.transform='none'}))});
at(5000,()=>$('#save').classList.add('show'));
</script></body></html>
