<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sputnik Ship — Contacts &amp; Shipments</title>
<meta name="theme-color" content="#ff6b45" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toast" class="toast" hidden></div>

<!-- Login / signup screen -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-badge">🚀</div>
      <h1>Sputnik Ship</h1>
    </div>
    <p class="muted">Contacts and shipment tracking, all in one place.</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">Log in</button>
      <button class="tab" data-tab="signup">Sign up</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Username
        <div class="handle-input">
          <span>@</span>
          <input type="text" name="handle" required autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" placeholder="yourusername" />
        </div>
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn-primary">Log in</button>
      <p class="error" id="login-error" hidden></p>
    </form>

    <form id="signup-form" class="auth-form" hidden>
      <label>Username
        <div class="handle-input">
          <span>@</span>
          <input type="text" name="handle" required autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" placeholder="yourusername" />
        </div>
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn-primary">Create account</button>
      <p class="error" id="signup-error" hidden></p>
    </form>
  </div>
</div>

<!-- Main app -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand-mini">
      <div class="brand-badge">🚀</div>
      <span>Sputnik Ship</span>
    </div>
    <div class="topbar-actions">
      <button id="notif-btn" class="icon-btn" title="Notifications">
        🔔<span id="notif-dot" class="dot" hidden></span>
      </button>
      <button id="logout-btn" class="icon-btn" title="Log out">⎋</button>
      <div class="avatar avatar-sm" id="topbar-avatar">?</div>
    </div>
  </header>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="shipments">📦<span>Shipments</span></button>
    <button class="nav-btn" data-view="contacts">👤<span>Contacts</span></button>
    <button class="nav-btn" data-view="notifications">🔔<span>Alerts</span></button>
  </nav>

  <main class="content">

    <!-- View: Shipments -->
    <section id="view-shipments" class="view active">
      <div class="greeting-glow"></div>
      <div class="greeting-row">
        <div class="greeting-with-avatar">
          <div class="avatar avatar-lg" id="greeting-avatar">?</div>
          <div class="greeting">
            <h1 id="greeting-title">Hi</h1>
            <p id="greeting-sub">Updates automatically every 30 minutes.</p>
          </div>
        </div>
        <div class="stat-pill">
          <span class="stat-pill-icon">🚚</span>
          <span class="stat-pill-text"><span class="stat-pill-num" id="active-shipments-count">0</span> in progress</span>
        </div>
      </div>
      <div class="view-header">
        <button id="refresh-now-btn" class="btn-secondary small">Refresh now</button>
        <button id="add-shipment-btn" class="btn-primary small">+ New shipment</button>
      </div>
      <input id="shipment-search" class="search" type="search" placeholder="Search by tracking number or label…" />
      <div id="shipments-list" class="cards"></div>
    </section>

    <!-- View: Shipment detail + map -->
    <section id="view-shipment-detail" class="view">
      <div class="view-header">
        <button class="btn-secondary small" id="back-to-shipments">← Back</button>
      </div>
      <div id="map" class="map"></div>
      <div id="shipment-detail-body" class="shipment-hero"></div>
      <div id="checkpoints-list" class="checkpoints"></div>
    </section>

    <!-- View: Contacts -->
    <section id="view-contacts" class="view">
      <div class="view-header">
        <h2>Contacts</h2>
        <button id="add-contact-btn" class="btn-primary small">+ New contact</button>
      </div>
      <input id="contact-search" class="search" type="search" placeholder="Search contacts…" />
      <div id="contacts-list" class="cards"></div>
    </section>

    <!-- View: Notifications -->
    <section id="view-notifications" class="view">
      <div class="view-header">
        <h2>Notifications</h2>
        <div style="display:flex; gap:6px;">
          <button id="push-toggle-btn" class="btn-secondary small" hidden>Enable notifications</button>
          <button id="mark-all-read-btn" class="btn-secondary small">Mark all read</button>
        </div>
      </div>
      <div id="notifications-list" class="cards"></div>
    </section>

  </main>
</div>

<!-- Modal: new/edit contact -->
<div id="contact-modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="contact-modal-title">New contact</h3>
    <form id="contact-form">
      <input type="hidden" name="id" />
      <label>Name *<input type="text" name="name" required /></label>
      <label>Phone<input type="tel" name="phone" /></label>
      <label>Email<input type="email" name="email" /></label>
      <label>Company<input type="text" name="company" /></label>
      <label>Address<input type="text" name="address" /></label>
      <label>Notes<textarea name="notes" rows="2"></textarea></label>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="contact-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: new shipment -->
<div id="shipment-modal" class="modal" hidden>
  <div class="modal-card">
    <h3>New shipment</h3>

    <button type="button" class="btn-secondary scan-label-btn" id="scan-label-btn">📷 Scan label</button>
    <input type="file" accept="image/*" capture="environment" id="scan-label-input" hidden />
    <p class="field-hint" id="scan-status" hidden></p>

    <form id="shipment-form">
      <label>Courier *
        <select name="carrier" required>
          <option value="fedex">FedEx</option>
          <option value="ups">UPS</option>
          <option value="dhl">DHL</option>
          <option value="usps">USPS</option>
        </select>
      </label>
      <label>Tracking number *
        <input type="text" name="trackingNumber" required autocomplete="off" />
        <span class="field-hint" id="carrier-detect-hint"></span>
      </label>
      <label>Linked contact
        <select name="contactId">
          <option value="">— None —</option>
        </select>
      </label>
      <label>Label / description<input type="text" name="label" placeholder="E.g. Ingredients order" /></label>

      <div id="scan-contact-block" class="scan-contact-block" hidden>
        <label class="checkbox-label">
          <input type="checkbox" id="scan-save-contact" checked />
          Also save contact: <span id="scan-contact-name"></span>
        </label>
        <label>Name<input type="text" id="scan-contact-name-input" /></label>
        <label>Address<input type="text" id="scan-contact-address-input" /></label>
        <p class="field-hint">Detected from photo — check before saving.</p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="shipment-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/scan.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
